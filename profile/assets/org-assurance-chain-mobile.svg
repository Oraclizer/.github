<svg xmlns="http://www.w3.org/2000/svg" width="600" height="2240" viewBox="0 0 600 2240" role="img" aria-labelledby="chain-title chain-desc" preserveAspectRatio="xMidYMid meet">
  <title id="chain-title">Oraclizer assurance chain for narrow screens</title>
  <desc id="chain-desc">A vertically stacked assurance chain. Mechanized Isabelle models feed bounded evidence bridges, which pin named implementations. A separate final band states the target of full core refinement and is not a current claim.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0a1728"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0v28" fill="none" stroke="#6e8aac" stroke-width="1" opacity=".045"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#5b93ff"/></marker>
    <style>.stage{fill:#0d1b2d;stroke:#294866;stroke-width:2}.card{fill:#12263e;stroke:#315475;stroke-width:2}.title{font:700 25px Inter,Segoe UI,Arial,sans-serif;fill:#f4f8ff}.text{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#f4f8ff}.body{font:15px Inter,Segoe UI,Arial,sans-serif;fill:#afc0d4}.eyebrow{font:700 14px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.8px;fill:#6fa0ff}.flow{fill:none;stroke:#5b93ff;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="600" height="2240" rx="24" fill="url(#bg)"/>
  <rect width="600" height="2240" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="598" height="2238" rx="23" fill="none" stroke="#315072" stroke-width="2"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text class="eyebrow" x="30" y="44">ORACLIZER ASSURANCE CHAIN</text>
    <text class="title" x="30" y="80">Models, bridges, implementations</text>
    <text class="body" x="30" y="108">What each layer proves today, and what remains open</text>

    <rect class="stage" x="24" y="140" width="552" height="650" rx="22"/>
    <text class="eyebrow" x="48" y="180">MECHANIZED MODELS</text>
    <text class="body" x="48" y="208">Isabelle/HOL sessions</text>
    <path d="M48 224H552" stroke="#294866" stroke-width="2"/>
    <rect class="card" x="48" y="246" width="504" height="80" rx="14"/><text class="text" x="68" y="276">Cross-domain state preservation</text><text class="body" x="68" y="303">preservation morphisms and degrees</text>
    <rect class="card" x="48" y="342" width="504" height="80" rx="14"/><text class="text" x="68" y="372">Regulatory action composition</text><text class="body" x="68" y="399">outcomes, commutativity, normal forms</text>
    <rect class="card" x="48" y="438" width="504" height="80" rx="14"/><text class="text" x="68" y="468">Protected-behavior obstructions</text><text class="body" x="68" y="495">independent partial companion</text>
    <rect class="card" x="48" y="534" width="504" height="80" rx="14"/><text class="text" x="68" y="564">GKR protocol soundness</text><text class="body" x="68" y="591">layered reduction with a derived bound</text>
    <rect class="card" x="48" y="630" width="504" height="80" rx="14"/><text class="text" x="68" y="660">SMT circuit-compiler correctness</text><text class="body" x="68" y="687">both directions across all three operations</text>
    <circle cx="54" cy="752" r="6" fill="#6be0b6"/><text class="body" x="72" y="758">Machine-checked, sorry-free sessions</text>

    <path class="flow" d="M300 790v46"/>
    <rect class="stage" x="24" y="840" width="552" height="570" rx="22"/>
    <text class="eyebrow" x="48" y="880">BOUNDED BRIDGES</text>
    <text class="body" x="48" y="908">Evidence that exists today</text>
    <path d="M48 924H552" stroke="#294866" stroke-width="2"/>
    <rect class="card" x="48" y="946" width="504" height="84" rx="14"/><text class="text" x="68" y="976">Recorded contracts + Creusot replay</text><text class="body" x="68" y="1004">named Rust functions in five crates</text>
    <rect class="card" x="48" y="1046" width="504" height="84" rx="14"/><text class="text" x="68" y="1076">KEVM runtime claims + Certora rules</text><text class="body" x="68" y="1104">bounded rules and selected bytecode proofs</text>
    <rect class="card" x="48" y="1146" width="504" height="84" rx="14"/><text class="text" x="68" y="1176">Deterministic builds</text><text class="body" x="68" y="1204">frozen source identity and identical hashes</text>
    <rect class="card" x="48" y="1246" width="504" height="84" rx="14"/><text class="text" x="68" y="1276">External proof receipt</text><text class="body" x="68" y="1304">recorded on a public verification chain</text>
    <circle cx="54" cy="1372" r="6" fill="#ffd27a"/><text class="body" x="72" y="1378">Every bridge states its exact scope</text>

    <path class="flow" d="M300 1410v46"/>
    <rect class="stage" x="24" y="1460" width="552" height="510" rx="22"/>
    <text class="eyebrow" x="48" y="1500">PINNED IMPLEMENTATIONS</text>
    <text class="body" x="48" y="1528">Where the models are meant to land</text>
    <path d="M48 1544H552" stroke="#294866" stroke-width="2"/>
    <rect class="card" x="48" y="1566" width="504" height="110" rx="14"/><text class="text" x="68" y="1598">StateSync-GKR prover</text><rect x="68" y="1612" width="62" height="26" rx="13" fill="#193a64"/><text x="99" y="1630" text-anchor="middle" fill="#afcbff" font-size="12" font-weight="700">RUST</text><text class="body" x="68" y="1658">prover and verification crates</text>
    <rect class="card" x="48" y="1692" width="504" height="110" rx="14"/><text class="text" x="68" y="1724">ERC-TRUST reference</text><rect x="68" y="1738" width="84" height="26" rx="13" fill="#193a64"/><text x="110" y="1756" text-anchor="middle" fill="#afcbff" font-size="12" font-weight="700">SOLIDITY</text><text class="body" x="68" y="1784">public reference implementation</text>
    <rect class="card" x="48" y="1818" width="504" height="110" rx="14"/><text class="text" x="68" y="1850">Settlement EVM reference</text><rect x="68" y="1864" width="92" height="26" rx="13" fill="#193a64"/><text x="114" y="1882" text-anchor="middle" fill="#afcbff" font-size="12" font-weight="700">FOUNDRY</text><text class="body" x="68" y="1910">reference design on draft branches</text>

    <rect x="24" y="2020" width="552" height="180" rx="20" fill="#0a1626" stroke="#ffd27a" stroke-width="2" stroke-dasharray="9 7"/>
    <circle cx="48" cy="2054" r="7" fill="#ffd27a"/><text x="68" y="2060" fill="#ffd27a" font-size="15" font-weight="700" letter-spacing="1.5">TARGET</text>
    <text x="48" y="2094" fill="#d9e5f3" font-size="17">Full core refinement from models to runtime,</text>
    <text x="48" y="2120" fill="#d9e5f3" font-size="17">closed stepwise and published with its evidence.</text>
    <text x="48" y="2156" fill="#8fa5be" font-size="14">The bridges above are bounded and state their scope.</text>
    <text x="48" y="2178" fill="#8fa5be" font-size="14">This band is a goal, not a current claim.</text>
  </g>
</svg>
