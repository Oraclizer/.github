<svg width="1200" height="740" viewBox="0 0 1200 740" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Oraclizer system and research map</title>
  <desc id="desc">A project map showing on-chain and off-chain systems connected to the OIP and OSS target architecture, supported by regulatory semantics and assurance work. Each artifact includes its current public or private status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="1" stop-color="#0A1728"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 256) rotate(90) scale(330 530)">
      <stop stop-color="#2473FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2473FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#6E8AAC" stroke-opacity="0.08"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L8 5L1 9" stroke="#5B93FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M9 1L2 5L9 9" stroke="#5B93FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000814" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="740" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="740" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="740" rx="28" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="738.5" rx="27.25" stroke="#315072" stroke-opacity="0.7" stroke-width="1.5"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="58" fill="#6FA0FF" font-size="14" font-weight="700" letter-spacing="2.6">ORACLIZER SYSTEM MAP</text>
    <text x="64" y="94" fill="#F4F8FF" font-size="28" font-weight="700">Protocol, regulatory semantics, and assurance</text>
    <text x="64" y="120" fill="#9EB1C8" font-size="16">Current project surfaces with publication and maturity boundaries</text>

    <g filter="url(#shadow)">
      <rect x="64" y="164" width="294" height="112" rx="18" fill="#0D1B2D" stroke="#294866"/>
      <circle cx="92" cy="192" r="7" fill="#5B93FF"/>
      <text x="112" y="199" fill="#F4F8FF" font-size="18" font-weight="700">OFF-CHAIN SYSTEMS</text>
      <text x="92" y="229" fill="#AFC0D4" font-size="15">Financial, identity, and regulated state</text>
      <text x="92" y="253" fill="#7F95AF" font-size="14">External systems and authoritative records</text>

      <rect x="842" y="164" width="294" height="112" rx="18" fill="#0D1B2D" stroke="#294866"/>
      <circle cx="870" cy="192" r="7" fill="#5B93FF"/>
      <text x="890" y="199" fill="#F4F8FF" font-size="18" font-weight="700">ON-CHAIN SYSTEMS</text>
      <text x="870" y="229" fill="#AFC0D4" font-size="15">Token, contract, and settlement state</text>
      <text x="870" y="253" fill="#7F95AF" font-size="14">EVM networks and protocol endpoints</text>
    </g>

    <path d="M358 220H426" stroke="#5B93FF" stroke-width="2" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
    <path d="M774 220H842" stroke="#5B93FF" stroke-width="2" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="426" y="145" width="348" height="166" rx="22" fill="#10233A" stroke="#4D7FC7" stroke-width="1.5"/>
      <text x="454" y="179" fill="#6FA0FF" font-size="13" font-weight="700" letter-spacing="1.8">TARGET ARCHITECTURE</text>
      <text x="454" y="210" fill="#FFFFFF" font-size="23" font-weight="700">ORACLE STATE MACHINE</text>
      <text x="454" y="237" fill="#B7C9DD" font-size="15">Protocol-level coordination of state transitions</text>
      <rect x="454" y="255" width="132" height="28" rx="14" fill="#193A64"/>
      <text x="520" y="274" text-anchor="middle" fill="#AFCBFF" font-size="12" font-weight="700">OIP v0.5 · PUBLISHED</text>
      <rect x="596" y="255" width="150" height="28" rx="14" fill="#2C2449"/>
      <text x="671" y="274" text-anchor="middle" fill="#D8CAFF" font-size="12" font-weight="700">OSS · IN DEVELOPMENT</text>
      <text x="454" y="302" fill="#72A2FF" font-size="13" font-weight="600" letter-spacing="1.1">BIND  →  VERIFY  →  COMMIT</text>
    </g>

    <path d="M318 374V343H600" stroke="#5B93FF" stroke-width="2"/>
    <path d="M882 374V343H600" stroke="#5B93FF" stroke-width="2"/>
    <path d="M600 343V311" stroke="#5B93FF" stroke-width="2" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="64" y="374" width="510" height="230" rx="20" fill="#0D1B2D" stroke="#294866"/>
      <text x="92" y="410" fill="#F4F8FF" font-size="21" font-weight="700">REGULATORY SEMANTICS</text>
      <text x="92" y="436" fill="#8EA6C0" font-size="14">Shared meaning, state transitions, and execution boundaries</text>

      <rect x="92" y="460" width="454" height="56" rx="12" fill="#12263E"/>
      <text x="112" y="485" fill="#FFFFFF" font-size="16" font-weight="700">RCP / ERC-8319</text>
      <text x="112" y="505" fill="#AFC0D4" font-size="13">Public proposal · open and under editor review</text>
      <rect x="428" y="474" width="98" height="24" rx="12" fill="#173D35"/>
      <text x="477" y="491" text-anchor="middle" fill="#6BE0B6" font-size="11" font-weight="700">PUBLIC</text>

      <rect x="92" y="528" width="454" height="56" rx="12" fill="#12263E"/>
      <text x="112" y="553" fill="#FFFFFF" font-size="16" font-weight="700">ERC-TRUST</text>
      <text x="112" y="573" fill="#AFC0D4" font-size="13">Private pre-ERC candidate · public release planned</text>
      <rect x="420" y="542" width="106" height="24" rx="12" fill="#4A3617"/>
      <text x="473" y="559" text-anchor="middle" fill="#FFD27A" font-size="11" font-weight="700">PRIVATE</text>

      <rect x="626" y="374" width="510" height="230" rx="20" fill="#0D1B2D" stroke="#294866"/>
      <text x="654" y="410" fill="#F4F8FF" font-size="21" font-weight="700">ASSURANCE</text>
      <text x="654" y="436" fill="#8EA6C0" font-size="14">Machine-checked models and proving infrastructure</text>

      <rect x="654" y="460" width="454" height="56" rx="12" fill="#12263E"/>
      <text x="674" y="485" fill="#FFFFFF" font-size="16" font-weight="700">formal-verification</text>
      <text x="674" y="505" fill="#AFC0D4" font-size="13">Production-maintained, model-level research artifacts</text>
      <rect x="990" y="474" width="98" height="24" rx="12" fill="#173D35"/>
      <text x="1039" y="491" text-anchor="middle" fill="#6BE0B6" font-size="11" font-weight="700">PUBLIC</text>

      <rect x="654" y="528" width="454" height="56" rx="12" fill="#12263E"/>
      <text x="674" y="553" fill="#FFFFFF" font-size="16" font-weight="700">StateSync-GKR</text>
      <text x="674" y="573" fill="#AFC0D4" font-size="13">Private prover stack · release after readiness gates</text>
      <rect x="982" y="542" width="106" height="24" rx="12" fill="#4A3617"/>
      <text x="1035" y="559" text-anchor="middle" fill="#FFD27A" font-size="11" font-weight="700">PRIVATE</text>
    </g>

    <rect x="64" y="636" width="1072" height="66" rx="16" fill="#0A1626" stroke="#243F5B"/>
    <circle cx="92" cy="669" r="6" fill="#6FA0FF"/>
    <text x="112" y="662" fill="#D9E5F3" font-size="14" font-weight="700">ASSURANCE BOUNDARY</text>
    <text x="112" y="684" fill="#8FA5BE" font-size="13">Project map, not a deployment diagram. Public proofs do not establish audit status, legal compliance, deployed security, or model-to-code refinement.</text>
  </g>
</svg>
