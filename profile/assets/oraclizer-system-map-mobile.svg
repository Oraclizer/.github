<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1540" viewBox="0 0 600 1540" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Oraclizer system and research map for narrow screens</title>
  <desc id="desc">A vertically arranged project map showing off-chain and on-chain systems synchronized through the OIP and OSS target architecture, with regulatory semantics, assurance work, and current publication and maturity labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0a1728"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#245ea8" stop-opacity=".13"/><stop offset=".45" stop-color="#245ea8" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0v28" fill="none" stroke="#6e8aac" stroke-width="1" opacity=".045"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#5b93ff"/></marker>
    <style>.stage{fill:#0d1b2d;stroke:#294866;stroke-width:2}.card{fill:#12263e;stroke:#315475;stroke-width:2}.title{font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#f4f8ff}.text{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#f4f8ff}.body{font:15px Inter,Segoe UI,Arial,sans-serif;fill:#afc0d4}.eyebrow{font:700 14px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.8px;fill:#6fa0ff}.flow{fill:none;stroke:#5b93ff;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="600" height="1540" rx="24" fill="url(#bg)"/>
  <rect width="600" height="1540" rx="24" fill="url(#grid)"/>
  <rect width="600" height="1540" rx="24" fill="url(#glow)"/>
  <rect x="1" y="1" width="598" height="1538" rx="23" fill="none" stroke="#315072" stroke-width="2"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text class="eyebrow" x="30" y="44">ORACLIZER SYSTEM MAP</text>
    <text class="title" x="30" y="80">Protocol, semantics, and assurance</text>
    <text class="body" x="30" y="108">Current publication and maturity boundaries</text>

    <rect class="stage" x="24" y="138" width="552" height="258" rx="22"/>
    <text class="eyebrow" x="48" y="174">SOURCE SYSTEMS</text>
    <rect class="card" x="48" y="198" width="240" height="118" rx="16"/>
    <circle cx="72" cy="226" r="6" fill="#5b93ff"/>
    <text class="text" x="90" y="233">OFF-CHAIN</text>
    <text class="body" x="72" y="268">Financial, identity,</text><text class="body" x="72" y="291">and regulated state</text>
    <rect class="card" x="312" y="198" width="240" height="118" rx="16"/>
    <circle cx="336" cy="226" r="6" fill="#5b93ff"/>
    <text class="text" x="354" y="233">ON-CHAIN</text>
    <text class="body" x="336" y="268">Token, contract,</text><text class="body" x="336" y="291">and settlement state</text>
    <path d="M168 316v22h132M432 316v22H300" fill="none" stroke="#5b93ff" stroke-width="2"/>
    <rect x="208" y="338" width="184" height="36" rx="18" fill="#0b1b2e" stroke="#4d7fc7" stroke-width="2"/>
    <text x="300" y="362" text-anchor="middle" fill="#afcbff" font-size="14" font-weight="700" letter-spacing="1.2">STATE SYNC</text>

    <path class="flow" d="M300 396v32"/>
    <rect x="24" y="432" width="552" height="246" rx="22" fill="#10233a" stroke="#4d7fc7" stroke-width="2"/>
    <text class="eyebrow" x="48" y="472">TARGET ARCHITECTURE</text>
    <text x="48" y="516" fill="#fff" font-size="28" font-weight="750">ORACLE STATE MACHINE</text>
    <text class="body" x="48" y="548">Bidirectional coordination of state transitions</text>
    <rect x="48" y="578" width="224" height="42" rx="21" fill="#193a64"/>
    <text x="160" y="605" text-anchor="middle" fill="#afcbff" font-size="15" font-weight="700">OIP v0.5 · PUBLISHED</text>
    <rect x="288" y="578" width="240" height="42" rx="21" fill="#2c2449"/>
    <text x="408" y="605" text-anchor="middle" fill="#d8caff" font-size="15" font-weight="700">OSS · IN DEVELOPMENT</text>
    <text x="48" y="651" fill="#72a2ff" font-size="16" font-weight="650" letter-spacing=".8">BIND → VERIFY → COMMIT</text>

    <rect class="stage" x="24" y="730" width="552" height="286" rx="22"/>
    <path class="flow" d="M300 730v-48"/>
    <text class="title" x="48" y="774">Regulatory semantics</text>
    <text class="body" x="48" y="804">Shared meaning, transitions, and execution boundaries</text>
    <rect class="card" x="48" y="832" width="504" height="72" rx="14"/>
    <text class="text" x="68" y="860">RCP / ERC-8319</text>
    <text class="body" x="68" y="884">Public proposal · open editor review</text>
    <rect x="438" y="847" width="92" height="30" rx="15" fill="#173d35"/><text x="484" y="868" text-anchor="middle" fill="#6be0b6" font-size="13" font-weight="700">PUBLIC</text>
    <rect class="card" x="48" y="920" width="504" height="72" rx="14"/>
    <text class="text" x="68" y="948">ERC-TRUST</text>
    <text class="body" x="68" y="972">Public pre-ERC candidate · community review</text>
    <rect x="438" y="935" width="92" height="30" rx="15" fill="#173d35"/><text x="484" y="956" text-anchor="middle" fill="#6be0b6" font-size="13" font-weight="700">PUBLIC</text>

    <rect class="stage" x="24" y="1068" width="552" height="316" rx="22"/>
    <path class="flow" d="M300 1068v-48"/>
    <text class="title" x="48" y="1112">Assurance</text>
    <text class="body" x="48" y="1142">Machine-checked models and proving infrastructure</text>
    <rect class="card" x="48" y="1172" width="504" height="82" rx="14"/>
    <text class="text" x="68" y="1202">formal-verification</text>
    <text class="body" x="68" y="1228">Production-maintained model artifacts</text>
    <rect x="438" y="1194" width="92" height="30" rx="15" fill="#173d35"/><text x="484" y="1215" text-anchor="middle" fill="#6be0b6" font-size="13" font-weight="700">PUBLIC</text>
    <rect class="card" x="48" y="1270" width="504" height="82" rx="14"/>
    <text class="text" x="68" y="1300">StateSync-GKR</text>
    <text class="body" x="68" y="1326">Private prover stack · public release planned</text>
    <rect x="430" y="1292" width="100" height="30" rx="15" fill="#4a3617"/><text x="480" y="1313" text-anchor="middle" fill="#ffd27a" font-size="13" font-weight="700">PRIVATE</text>

    <rect x="24" y="1428" width="552" height="78" rx="16" fill="#0a1626" stroke="#243f5b" stroke-width="2"/>
    <circle cx="48" cy="1460" r="6" fill="#6fa0ff"/>
    <text x="66" y="1457" fill="#d9e5f3" font-size="14" font-weight="700">ASSURANCE BOUNDARY</text>
    <text x="66" y="1483" fill="#8fa5be" font-size="13">Project map only. No audit, deployment, legal, or full-refinement claim.</text>
  </g>
</svg>
