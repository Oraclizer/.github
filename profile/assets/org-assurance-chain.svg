<svg width="1200" height="740" viewBox="0 0 1200 740" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chain-title chain-desc">
  <title id="chain-title">Oraclizer assurance chain</title>
  <desc id="chain-desc">Three columns read left to right. Mechanized Isabelle/HOL models feed bounded bridges that carry evidence today, and those bridges pin named implementations. A dashed band across the bottom states the target of full core refinement from models to runtime, distinguished from the bounded evidence that exists now.</desc>
  <defs>
    <linearGradient id="chain-bg" x1="0" y1="0" x2="1200" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="1" stop-color="#0A1728"/>
    </linearGradient>
    <radialGradient id="chain-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 330) rotate(90) scale(340 540)">
      <stop stop-color="#2473FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2473FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="chain-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#6E8AAC" stroke-opacity="0.08"/>
    </pattern>
    <marker id="chain-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L8 5L1 9" stroke="#5B93FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="chain-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000814" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="740" rx="28" fill="url(#chain-bg)"/>
  <rect width="1200" height="740" rx="28" fill="url(#chain-grid)"/>
  <rect width="1200" height="740" rx="28" fill="url(#chain-glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="738.5" rx="27.25" stroke="#315072" stroke-opacity="0.7" stroke-width="1.5"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="58" fill="#6FA0FF" font-size="14" font-weight="700" letter-spacing="2.6">ORACLIZER ASSURANCE CHAIN</text>
    <text x="64" y="94" fill="#F4F8FF" font-size="28" font-weight="700">From mechanized models to pinned implementations</text>
    <text x="64" y="120" fill="#9EB1C8" font-size="16">What each layer proves today, and how much of the chain is still open</text>

    <g filter="url(#chain-shadow)">
      <rect x="64" y="150" width="332" height="450" rx="20" fill="#0D1B2D" stroke="#294866"/>
      <rect x="434" y="150" width="332" height="450" rx="20" fill="#0D1B2D" stroke="#294866"/>
      <rect x="804" y="150" width="332" height="450" rx="20" fill="#0D1B2D" stroke="#294866"/>
    </g>

    <g aria-label="Mechanized models column">
      <text x="86" y="180" fill="#6FA0FF" font-size="13" font-weight="700" letter-spacing="1.6">MECHANIZED MODELS</text>
      <text x="86" y="201" fill="#9EB1C8" font-size="13">Isabelle/HOL sessions</text>
      <path d="M86 213H374" stroke="#294866"/>

      <rect x="86" y="224" width="288" height="58" rx="12" fill="#12263E"/>
      <text x="102" y="248" fill="#F4F8FF" font-size="14" font-weight="600">Cross-domain state preservation</text>
      <text x="102" y="267" fill="#AFC0D4" font-size="11.5">preservation morphisms and degrees</text>

      <rect x="86" y="292" width="288" height="58" rx="12" fill="#12263E"/>
      <text x="102" y="316" fill="#F4F8FF" font-size="14" font-weight="600">Regulatory action composition</text>
      <text x="102" y="335" fill="#AFC0D4" font-size="11.5">outcomes, commutativity, normal forms</text>

      <rect x="86" y="360" width="288" height="58" rx="12" fill="#12263E"/>
      <text x="102" y="384" fill="#F4F8FF" font-size="14" font-weight="600">Protected-behavior obstructions</text>
      <text x="102" y="403" fill="#AFC0D4" font-size="11.5">independent partial companion</text>

      <rect x="86" y="428" width="288" height="58" rx="12" fill="#12263E"/>
      <text x="102" y="452" fill="#F4F8FF" font-size="14" font-weight="600">GKR protocol soundness</text>
      <text x="102" y="471" fill="#AFC0D4" font-size="11.5">layered reduction, derived bound</text>

      <rect x="86" y="496" width="288" height="58" rx="12" fill="#12263E"/>
      <text x="102" y="520" fill="#F4F8FF" font-size="13.5" font-weight="600">SMT circuit-compiler correctness</text>
      <text x="102" y="539" fill="#AFC0D4" font-size="11.5">both directions, all three operations</text>

      <circle cx="92" cy="576" r="5" fill="#6BE0B6"/>
      <text x="108" y="581" fill="#8EA6C0" font-size="12">machine-checked, sorry-free sessions</text>
    </g>

    <g aria-label="Bounded bridges column">
      <text x="456" y="180" fill="#6FA0FF" font-size="13" font-weight="700" letter-spacing="1.6">BOUNDED BRIDGES</text>
      <text x="456" y="201" fill="#9EB1C8" font-size="13">Evidence that exists today</text>
      <path d="M456 213H744" stroke="#294866"/>

      <rect x="456" y="224" width="288" height="68" rx="12" fill="#12263E"/>
      <text x="472" y="252" fill="#F4F8FF" font-size="13" font-weight="600">Recorded contracts + Creusot replay</text>
      <text x="472" y="273" fill="#AFC0D4" font-size="11.5">named Rust functions in five crates</text>

      <rect x="456" y="308" width="288" height="68" rx="12" fill="#12263E"/>
      <text x="472" y="336" fill="#F4F8FF" font-size="13" font-weight="600">KEVM runtime claims + Certora rules</text>
      <text x="472" y="357" fill="#AFC0D4" font-size="11.5">bounded rules, selected bytecode proofs</text>

      <rect x="456" y="392" width="288" height="68" rx="12" fill="#12263E"/>
      <text x="472" y="420" fill="#F4F8FF" font-size="13" font-weight="600">Deterministic builds</text>
      <text x="472" y="441" fill="#AFC0D4" font-size="11.5">frozen source identity, identical hashes</text>

      <rect x="456" y="476" width="288" height="68" rx="12" fill="#12263E"/>
      <text x="472" y="504" fill="#F4F8FF" font-size="13" font-weight="600">External proof receipt</text>
      <text x="472" y="525" fill="#AFC0D4" font-size="11.5">recorded on a public verification chain</text>

      <circle cx="462" cy="576" r="5" fill="#FFD27A"/>
      <text x="478" y="581" fill="#8EA6C0" font-size="12">each bridge states its exact scope</text>
    </g>

    <g aria-label="Pinned implementations column">
      <text x="826" y="180" fill="#6FA0FF" font-size="13" font-weight="700" letter-spacing="1.6">PINNED IMPLEMENTATIONS</text>
      <text x="826" y="201" fill="#9EB1C8" font-size="13">Where the models are meant to land</text>
      <path d="M826 213H1114" stroke="#294866"/>

      <rect x="826" y="224" width="288" height="94" rx="12" fill="#12263E"/>
      <text x="842" y="254" fill="#F4F8FF" font-size="15" font-weight="700">StateSync-GKR prover</text>
      <rect x="842" y="268" width="52" height="22" rx="11" fill="#193A64"/>
      <text x="868" y="283" text-anchor="middle" fill="#AFCBFF" font-size="10" font-weight="700">RUST</text>
      <text x="842" y="306" fill="#AFC0D4" font-size="11.5">prover and verification crates</text>

      <rect x="826" y="340" width="288" height="94" rx="12" fill="#12263E"/>
      <text x="842" y="370" fill="#F4F8FF" font-size="15" font-weight="700">ERC-TRUST reference</text>
      <rect x="842" y="384" width="74" height="22" rx="11" fill="#193A64"/>
      <text x="879" y="399" text-anchor="middle" fill="#AFCBFF" font-size="10" font-weight="700">SOLIDITY</text>
      <text x="842" y="422" fill="#AFC0D4" font-size="11.5">reference implementation under review</text>

      <rect x="826" y="456" width="288" height="94" rx="12" fill="#12263E"/>
      <text x="842" y="486" fill="#F4F8FF" font-size="15" font-weight="700">Settlement EVM reference</text>
      <rect x="842" y="500" width="70" height="22" rx="11" fill="#193A64"/>
      <text x="877" y="515" text-anchor="middle" fill="#AFCBFF" font-size="10" font-weight="700">FOUNDRY</text>
      <text x="842" y="538" fill="#AFC0D4" font-size="11.5">reference design on draft branches</text>

      <circle cx="832" cy="576" r="5" fill="#6FA0FF"/>
      <text x="848" y="581" fill="#8EA6C0" font-size="12">each repository pins its own toolchain</text>
    </g>

    <path d="M400 380H428" stroke="#5B93FF" stroke-width="2" marker-end="url(#chain-arrow)"/>
    <path d="M770 380H798" stroke="#5B93FF" stroke-width="2" marker-end="url(#chain-arrow)"/>

    <rect x="64" y="624" width="1072" height="90" rx="16" fill="#0A1626" stroke="#FFD27A" stroke-width="1.6" stroke-dasharray="9 7"/>
    <circle cx="92" cy="651" r="6" fill="#FFD27A"/>
    <text x="112" y="656" fill="#FFD27A" font-size="13" font-weight="700" letter-spacing="1.6">TARGET</text>
    <text x="112" y="681" fill="#D9E5F3" font-size="15">Full core refinement, models to runtime, closed stepwise and published with its evidence.</text>
    <text x="112" y="702" fill="#8FA5BE" font-size="12">The bridges above are bounded today and each states its own scope. This band is the goal, not a current claim.</text>
  </g>
</svg>
